version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for routine bumps; majors still arrive individually.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base image updates for the Dockerfile (node:22-bookworm-slim).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
